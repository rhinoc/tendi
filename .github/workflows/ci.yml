name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-notes:
    name: Validate release notes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate changeset scripts
        run: |
          bash -n scripts/consume_changesets.sh
          bash -n scripts/render_changesets.sh
          bash -n scripts/test_changesets.sh
          scripts/test_changesets.sh

      - name: Require a release changeset
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          scripts/render_changesets.sh "$notes"
          if [[ ! -s "$notes" ]]; then
            echo "Every pull request must include an English .changeset/*.md entry." >&2
            exit 1
          fi
          cat "$notes"

  rust:
    name: Rust tests and check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check Rust test boundaries
        run: bash scripts/check-rust-test-boundaries.sh

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-

      - name: Rust tests
        run: cargo test --workspace -- --test-threads=1

      - name: Rust check
        run: cargo check --workspace

  frontend:
    name: Frontend checks and E2E
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop

      - name: Validate runtime schema and generated contracts
        run: |
          npm run runtime:validate-schema --prefix apps/desktop
          npm run runtime:codegen --prefix apps/desktop -- --check
          npm run runtime:test-contract --prefix apps/desktop

      - name: Check frontend UI boundaries
        run: npm run check:ui-boundaries --prefix apps/desktop

      - name: Check provider boundaries
        run: npm run test:provider-boundaries --prefix apps/desktop

      - name: Check architecture boundaries
        run: npm run check:architecture --prefix apps/desktop

      - name: Check frontend typography tokens
        run: npm run check:typography --prefix apps/desktop

      - name: Frontend typecheck
        run: npm run typecheck --prefix apps/desktop

      - name: Frontend alignment e2e
        run: npm run e2e:align --prefix apps/desktop

      - name: Frontend build
        if: github.event_name == 'pull_request'
        run: npm run build --prefix apps/desktop

      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Cache Rust build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-

      - name: Tauri app and DMG build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build:dmg --prefix apps/desktop

      - name: Upload DMG artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tendi-dmg
          path: dist/*.dmg
          if-no-files-found: error

  build-test:
    if: ${{ always() }}
    needs: [rust, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$RUST_RESULT" = success
          test "$FRONTEND_RESULT" = success
