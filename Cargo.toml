[workspace]
members = [
    "crates/tendi-core",
    "crates/tendi-cli",
    "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.9"
toml_edit = "0.25"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = "2"
walkdir = "2"
tar = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.dev.package.tendi-core]
opt-level = 2
